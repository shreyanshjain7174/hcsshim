# Auto-request GitHub Copilot review on PRs that touch v2 shim code.
#
# Copilot review is guidance-only (non-blocking). CI remains the enforcement gate.
# The path filter ensures Copilot is NOT invoked on unrelated PRs (docs, scripts, etc.).
#
# Model selection:
#   The preferred model for code review is configured in the repo/org Copilot settings.
#   For systems-level Go code, Claude Sonnet 4 is recommended for its strength in
#   catching resource lifecycle bugs, concurrency issues, and layering violations.
#   Configure at: Settings > Copilot > Code review > Model
#   Fallback order: claude-sonnet-4 > gpt-4o > default

name: Copilot Review (V2 Shim)

on:
  pull_request:
    paths:
      # Shim binaries
      - "cmd/containerd-shim-runhcs-v1/**"
      - "cmd/containerd-shim-lcow-v2/**"
      # Core shim internals
      - "internal/hcsoci/**"
      - "internal/uvm/**"
      - "internal/layers/**"
      - "internal/hcs/**"
      - "internal/gcs/**"
      - "internal/cow/**"
      - "internal/resources/**"
      - "internal/jobcontainers/**"
      - "internal/guest/**"
      - "internal/shim/**"
      # VM controller & manager interfaces
      - "internal/controller/**"
      - "internal/vm/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot Review
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Preferred model for systems code review.
            // Claude Sonnet 4 excels at resource lifecycle, concurrency, and
            // memory safety analysis in Go systems code.
            const PREFERRED_MODEL = 'claude-sonnet-4';

            // Check if Copilot is already a reviewer to avoid duplicate requests.
            const reviews = await github.rest.pulls.listRequestedReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const alreadyRequested = reviews.data.users.some(
              (u) => u.login === 'copilot-pull-request-reviewer'
            );
            if (alreadyRequested) {
              core.info('Copilot review already requested — skipping.');
              return;
            }

            // Request Copilot as a reviewer.
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                reviewers: ['copilot-pull-request-reviewer'],
              });
              core.info(`Copilot review requested on PR #${pr.number} (preferred model: ${PREFERRED_MODEL})`);
            } catch (err) {
              // Non-fatal: Copilot may not be enabled on the repo.
              core.warning(`Could not request Copilot review: ${err.message}`);
            }

            // Add a label to indicate Copilot review was requested.
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['copilot-review'],
              });
            } catch (err) {
              core.info(`Could not add label: ${err.message}`);
            }
